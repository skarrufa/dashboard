<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ApexOS · Personal Executive Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23030712'/%3E%3Cpath d='M32 8 54 50H10Z' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 24 44 46H20Z' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='8' r='3.5' fill='%23fbbf24'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg0:#030712;--bg1:#0b1120;--txt:#e5e7eb;--mut:#94a3b8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 15% 10%,#0b1b3a 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#1a0b2e 0%,transparent 55%),var(--bg0);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
#desk{position:fixed;left:0;top:0;right:0;bottom:52px;overflow-x:hidden;overflow-y:auto}
.win{position:absolute;display:flex;flex-direction:column;border-radius:16px;background:linear-gradient(180deg,rgba(15,23,42,.72),rgba(11,17,32,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--c);box-shadow:0 18px 50px -12px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03) inset,0 0 28px -10px var(--c);overflow:hidden;min-width:260px;min-height:160px}
.win.focus{box-shadow:0 22px 60px -10px rgba(0,0,0,.75),0 0 38px -6px var(--c)}
.win.hidden{display:none}
.win.anim{transition:left .25s,top .25s,width .25s,height .25s}
.wh{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;background:linear-gradient(90deg,var(--c1),var(--c2));cursor:grab;user-select:none;touch-action:none;flex:none}
.wh:active{cursor:grabbing}
.wh .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:15px;flex:none}
.wh .ttl{font-weight:700;font-size:13px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:#fff}
.wh .hx{display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;opacity:.95}
.wc{display:flex;gap:5px;flex:none}
.wc button{width:24px;height:24px;border-radius:7px;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1}
.wc button:hover{background:rgba(255,255,255,.3)}
.wc .x:hover{background:#ef4444}
.wb{flex:1;overflow:auto;padding:12px;min-height:0}
.rh{position:absolute;z-index:3}
.rh-r{right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.rh-b{left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.rh-rb{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.rh-rb::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid rgba(255,255,255,.45);border-bottom:2px solid rgba(255,255,255,.45)}
.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);border-radius:9px;padding:5px 10px;cursor:pointer;font-size:12px;color:#fff}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.pri{background:var(--c);border-color:transparent;color:#04121a;font-weight:700}
.btn.pri:hover{filter:brightness(1.1)}
.inp{width:100%;background:rgba(2,6,23,.55);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:7px 10px;outline:none;font-size:13px}
.inp:focus{border-color:var(--c)}
select.inp option{background:#0b1120}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.3px;background:rgba(255,255,255,.1)}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.mut{color:var(--mut)}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse2{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.ring{animation:pulse2 1s infinite;background:#ef4444!important;color:#fff!important;border-color:transparent!important}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:4px 11px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,.14);background:transparent;cursor:pointer;color:#cbd5e1}
.tab.on{background:var(--c);color:#04121a;font-weight:700;border-color:transparent}
.list a{text-decoration:none}
.list .it{display:block;padding:9px 10px;border-radius:11px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);margin-bottom:7px}
.list .it:hover{background:rgba(255,255,255,.09);border-color:var(--c)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* taskbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(3,7,18,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);z-index:5000}
#tabs{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0}
.tb{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);cursor:pointer;font-size:12px;white-space:nowrap;color:#e2e8f0;border-bottom:3px solid var(--c)}
.tb.min{opacity:.55}.tb.on{background:rgba(255,255,255,.14)}
#launch{position:fixed;left:10px;bottom:60px;width:250px;padding:8px;border-radius:14px;background:rgba(11,17,32,.95);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);z-index:5001;display:none}
#launch.show{display:block}
#launch button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border:0;background:transparent;border-radius:9px;cursor:pointer;color:#e5e7eb;text-align:left}
#launch button:hover{background:rgba(255,255,255,.1)}
#launch .dot{width:9px;height:9px;border-radius:50%;margin-left:auto;border:1px solid rgba(255,255,255,.4)}
#launch .dot.on{background:#34d399;border-color:#34d399}
#net{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.18);white-space:nowrap}
#net.on{color:#34d399;border-color:#065f46}#net.off{color:#fbbf24;border-color:#78350f}
#tclock{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:6000;padding:16px}
#modal.show{display:grid}
#modal .box{width:min(420px,100%);padding:18px;border-radius:16px;background:#0b1120;border:1px solid #6366f1;box-shadow:0 20px 60px rgba(0,0,0,.7)}
/* mobile chrome hidden on desktop */
#pills,#dock{display:none}
@media (max-width:767px){
  html,body{overflow:auto;height:auto}
  #desk{position:static;overflow:visible;padding:62px 10px 84px;display:flex;flex-direction:column;gap:12px}
  .win{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;min-height:0;max-height:none}
  .win.hidden{display:flex!important}
  .wh{cursor:default}.wc,.rh{display:none!important}
  .wb{overflow:visible;max-height:none}
  .wb.scrollm{max-height:440px;overflow:auto}
  #bar{display:none}#launch{display:none!important}
  #pills{display:flex;position:fixed;top:0;left:0;right:0;gap:8px;overflow-x:auto;padding:10px;background:rgba(3,7,18,.85);backdrop-filter:blur(14px);z-index:5000;border-bottom:1px solid rgba(255,255,255,.1)}
  #pills a{flex:none;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--c);color:#fff;background:rgba(255,255,255,.06);white-space:nowrap}
  #dock{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));padding:6px;border-radius:18px;background:rgba(11,17,32,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14);z-index:5000}
  #dock a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:10px;text-decoration:none;color:#cbd5e1;border-radius:12px}
  #dock a span{font-size:18px}
  .deskonly{display:none!important}
}
.big{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-1px;line-height:1}
</style>
</head>
<body>
<div id="pills"></div>
<div id="desk"></div>
<div id="launch"></div>
<div id="bar">
  <button class="btn" id="btnLaunch" style="border-color:#6366f1;background:rgba(99,102,241,.25)">▦ Workspace</button>
  <button class="btn" id="btnTile" title="Auto-tile windows">⊞ Tile Windows</button>
  <div id="tabs"></div>
  <span id="net" class="on">● Online</span>
  <span id="tclock">--:--</span>
</div>
<div id="dock">
  <a href="#" data-go="clock"><span>🕒</span>Time</a>
  <a href="#" data-go="weather"><span>⛅</span>Weather</a>
  <a href="#" data-go="news"><span>📰</span>News</a>
  <a href="#" data-go="notes"><span>📝</span>Notes</a>
  <a href="#" data-go="tasks"><span>✅</span>Tasks</a>
  <a href="#" data-go="top"><span>⬆️</span>Top</a>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem('apex.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('apex.'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMobile=()=>matchMedia('(max-width:767px)').matches;
const pad=n=>String(n).padStart(2,'0');
const TZ={uae:'Asia/Dubai',bgd:'Asia/Baghdad',fra:'Europe/Berlin'};
function parts(tz,d=new Date()){const f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});const o={};f.formatToParts(d).forEach(p=>o[p.type]=p.value);o.hour=o.hour==='24'?'00':o.hour;return o}
function offsetMin(tz,d=new Date()){const p=parts(tz,d);const t=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);return Math.round((t-Math.floor(d.getTime()/1000)*1000)/60000)}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const todayUAE=()=>{const p=parts(TZ.uae);return `${p.year}-${p.month}-${p.day}`};
const dayNum=()=>{const p=parts(TZ.uae);return Math.floor(Date.UTC(+p.year,+p.month-1,+p.day)/864e5)};
async function getJSON(url,ms=8000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}
function shuffle(a,seed){a=a.slice();let s=seed>>>0||1;const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refreshBtn(id){return `<button class="btn" id="${id}" title="Refresh" style="padding:3px 8px"><span class="ri">⟳</span></button>`}
function spinOn(btn,on){const s=$('.ri',btn);if(s){s.style.display='inline-block';s.classList.toggle('spin',on)}}

/* ---------- window registry ---------- */
const WINS=[
 {id:'clock',  t:'Clock · Time Zones · Alarm',  i:'🕒',c:'#3b82f6',c1:'#1e3a8a',c2:'#2563eb',r:{x:16,y:16,w:400,h:560}},
 {id:'weather',t:'Hourly Weather Hub',          i:'⛅',c:'#14b8a6',c1:'#065f46',c2:'#0e7490',r:{x:432,y:16,w:430,h:400}},
 {id:'news',   t:'Hourly News Hub',             i:'📰',c:'#f59e0b',c1:'#92400e',c2:'#c2410c',r:{x:878,y:16,w:430,h:560}},
 {id:'notes',  t:'Executive Scratchpad',        i:'📝',c:'#22d3ee',c1:'#164e63',c2:'#334155',r:{x:432,y:430,w:430,h:300}},
 {id:'tasks',  t:'To-Do List',                  i:'✅',c:'#f43f5e',c1:'#881337',c2:'#be123c',r:{x:16,y:592,w:400,h:360}},
 {id:'reads',  t:'5 Thought-Provoking Reads',   i:'📚',c:'#a78bfa',c1:'#4c1d95',c2:'#6d28d9',r:{x:878,y:592,w:430,h:420}},
 {id:'links',  t:'Top 10 Weblinks',             i:'🔗',c:'#818cf8',c1:'#312e81',c2:'#4338ca',r:{x:1324,y:16,w:380,h:480}},
 {id:'movies', t:'Movies & TV · Current',       i:'🎬',c:'#fbbf24',c1:'#78350f',c2:'#b45309',r:{x:1324,y:512,w:380,h:500}},
 {id:'photo',  t:'World Photo of the Moment',   i:'🌍',c:'#38bdf8',c1:'#0c4a6e',c2:'#0369a1',r:{x:1720,y:16,w:400,h:400}},
 {id:'humor',  t:'Humor · Jokes & Articles',    i:'😄',c:'#f472b6',c1:'#831843',c2:'#be185d',r:{x:1720,y:432,w:400,h:480}}
];
const W={};            // id -> {def,el,st}
let zTop=10;
const desk=$('#desk');
const saved=LS.get('layoutv',0)===3?LS.get('layout',{}):{};

function build(){
  WINS.forEach(def=>{
    const st=Object.assign({x:def.r.x,y:def.r.y,w:def.r.w,h:def.r.h,open:true,min:false,max:false,z:++zTop},saved[def.id]||{});
    const el=document.createElement('section');
    el.className='win';el.id='win-'+def.id;
    el.style.setProperty('--c',def.c);el.style.setProperty('--c1',def.c1);el.style.setProperty('--c2',def.c2);
    el.innerHTML=`<header class="wh"><div class="ico">${def.i}</div><div class="ttl">${def.t}</div><div class="hx" data-hx></div>
      <div class="wc deskonly"><button data-a="min" title="Minimize">–</button><button data-a="max" title="Maximize / Restore">□</button><button class="x" data-a="close" title="Close">✕</button></div></header>
      <div class="wb" data-body></div><div class="rh rh-r"></div><div class="rh rh-b"></div><div class="rh rh-rb"></div>`;
    desk.appendChild(el);
    W[def.id]={def,el,st};
  });
  Object.values(W).forEach(w=>{wire(w);apply(w,false)});
  // mobile chrome
  $('#pills').innerHTML=WINS.map(d=>`<a href="#win-${d.id}" data-go="${d.id}" style="--c:${d.c}">${d.i} ${d.t.split(' ·')[0]}</a>`).join('');
  $$('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const id=a.dataset.go;if(id==='top'){scrollTo({top:0,behavior:'smooth'});return}const w=W[id];if(w)w.el.scrollIntoView({behavior:'smooth',block:'start'})}));
  renderBar();
}
function clampRect(st){
  if(isMobile())return;
  const dw=desk.clientWidth,dh=desk.clientHeight;
  st.w=Math.max(260,Math.min(st.w,dw));st.h=Math.max(160,Math.min(st.h,dh));
  st.x=Math.max(-st.w+120,Math.min(st.x,dw-120));st.y=Math.max(0,Math.min(st.y,6000));
}
function apply(w,anim){
  const {el,st}=w;
  el.classList.toggle('anim',!!anim);
  if(!isMobile()){
    if(st.max){Object.assign(el.style,{left:'0px',top:desk.scrollTop+'px',width:desk.clientWidth+'px',height:desk.clientHeight+'px'})}
    else{clampRect(st);Object.assign(el.style,{left:st.x+'px',top:st.y+'px',width:st.w+'px',height:st.h+'px'})}
  }
  el.style.zIndex=st.z;
  el.classList.toggle('hidden',!st.open||st.min);
  $('[data-a=max]',el).textContent=st.max?'❐':'□';
  if(anim)setTimeout(()=>el.classList.remove('anim'),300);
}
function persist(){const o={};Object.values(W).forEach(w=>{const s=w.st;o[w.def.id]={x:s.x,y:s.y,w:s.w,h:s.h,open:s.open,min:s.min,max:s.max}});LS.set('layout',o);LS.set('layoutv',3)}
function focus(id){const w=W[id];w.st.z=++zTop;w.el.style.zIndex=w.st.z;Object.values(W).forEach(o=>o.el.classList.toggle('focus',o===w));renderBar()}
function renderBar(){
  const t=$('#tabs');t.innerHTML='';
  Object.values(W).filter(w=>w.st.open).forEach(w=>{
    const b=document.createElement('button');b.className='tb'+(w.st.min?' min':'')+((!w.st.min&&w.el.classList.contains('focus'))?' on':'');
    b.style.setProperty('--c',w.def.c);b.innerHTML=`${w.def.i} <span>${w.def.t.split(' ·')[0]}</span>`;
    b.onclick=()=>{if(w.st.min){w.st.min=false;apply(w,true);focus(w.def.id)}else if(w.el.classList.contains('focus')){w.st.min=true;apply(w,true)}else focus(w.def.id);persist();renderBar()};
    t.appendChild(b);
  });
  const L=$('#launch');
  L.innerHTML=Object.values(W).map(w=>`<button data-l="${w.def.id}"><span>${w.def.i}</span><span>${w.def.t.split(' ·')[0]}</span><span class="dot ${w.st.open?'on':''}"></span></button>`).join('')+`<button data-l="__all" style="border-top:1px solid rgba(255,255,255,.1);margin-top:4px">↺ Reset layout</button>`;
  $$('button',L).forEach(b=>b.onclick=()=>{
    const id=b.dataset.l;
    if(id==='__all'){localStorage.removeItem('apex.layout');Object.values(W).forEach(w=>{Object.assign(w.st,{x:w.def.r.x,y:w.def.r.y,w:w.def.r.w,h:w.def.r.h,open:true,min:false,max:false});apply(w,true)});persist();renderBar();return}
    const w=W[id];if(w.st.open&&!w.st.min){w.st.open=false}else{w.st.open=true;w.st.min=false}
    apply(w,true);if(w.st.open)focus(id);persist();renderBar();
  });
}
function wire(w){
  const {el,st}=w;
  el.addEventListener('pointerdown',()=>focus(w.def.id),true);
  $$('[data-a]',el).forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const a=b.dataset.a;
    if(a==='min'){st.min=true}
    if(a==='close'){st.open=false}
    if(a==='max'){if(!st.max){st.prev={x:st.x,y:st.y,w:st.w,h:st.h};st.max=true}else{st.max=false;if(st.prev)Object.assign(st,st.prev)}}
    apply(w,true);persist();renderBar();
  }));
  const head=$('.wh',el);
  head.addEventListener('dblclick',e=>{if(e.target.closest('button,select,input'))return;$('[data-a=max]',el).click()});
  head.addEventListener('pointerdown',e=>{
    if(isMobile()||st.max||e.target.closest('button,select,input,a'))return;
    const sx=e.clientX,sy=e.clientY,ox=st.x,oy=st.y;head.setPointerCapture(e.pointerId);
    const mv=ev=>{st.x=ox+ev.clientX-sx;st.y=oy+ev.clientY-sy;clampRect(st);el.style.left=st.x+'px';el.style.top=st.y+'px'};
    const up=()=>{head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up);head.removeEventListener('pointercancel',up);persist()};
    head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);
  });
  [['rh-r',1,0],['rh-b',0,1],['rh-rb',1,1]].forEach(([cls,dx,dy])=>{
    const h=$('.'+cls,el);
    h.addEventListener('pointerdown',e=>{
      if(isMobile()||st.max)return;e.preventDefault();e.stopPropagation();
      const sx=e.clientX,sy=e.clientY,ow=st.w,oh=st.h;h.setPointerCapture(e.pointerId);
      const mv=ev=>{if(dx)st.w=Math.max(260,ow+ev.clientX-sx);if(dy)st.h=Math.max(160,oh+ev.clientY-sy);el.style.width=st.w+'px';el.style.height=st.h+'px'};
      const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);persist()};
      h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
    });
  });
}
function tile(){
  if(isMobile())return;
  const ws=Object.values(W).filter(w=>w.st.open&&!w.st.min);if(!ws.length)return;
  const dw=desk.clientWidth,dh=desk.clientHeight,g=8;
  const cols=Math.max(1,Math.min(4,Math.round(dw/380)));
  const cw=(dw-g*(cols+1))/cols,ch=Math.max(300,(dh-g*3)/2); // two rows fill the screen; further rows scroll
  desk.scrollTop=0;
  ws.forEach((w,i)=>{const c=i%cols,r=Math.floor(i/cols);Object.assign(w.st,{max:false,x:Math.round(g+c*(cw+g)),y:Math.round(g+r*(ch+g)),w:Math.round(cw),h:Math.round(ch)});apply(w,true)});
  persist();
}

function nextHoliday(){

  for(const [ds,name] of HOLIDAYS){const [yy,mm,dd]=ds.split('-').map(Number);const days=Math.round((Date.UTC(yy,mm-1,dd)-today)/864e5);if(days>=0)return {name,days,date:`${dd} ${MON[mm-1]} ${yy}`}}
  return null;

let audioCtx=null,ringTimer=null,ringing=false;
function chime(){
  if(!audioCtx)return;const t0=audioCtx.currentTime;
  [[880,0],[1108.7,0.18],[1318.5,0.36],[1760,0.54]].forEach(([f,dt])=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(0.35,t0+dt+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.7);
    o.connect(g).connect(audioCtx.destination);o.start(t0+dt);o.stop(t0+dt+0.75);
  });
}

function fallbackWeather(city,day){
  // plausible late-October Gulf climatology, shown only until live data arrives
  const base=city==='ad'?31:30,hum=city==='ad'?52:58;
  const hourly=[];for(let h=0;h<24;h++){const t=base-6+Math.round(7*Math.sin(Math.PI*(h-8)/14)*(h>=6&&h<=21?1:0.35)+ (h<6||h>21?0:0));
    hourly.push({h,t:Math.max(base-8,Math.min(base+2,t)),c:h>=6&&h<=18?(h%6===0?2:0):0,uv:h>=7&&h<=17?Math.max(0,Math.round(8*Math.sin(Math.PI*(h-6)/12))):0})}
  return {fallback:true,temp:base,hum,wind:14,code:0,hourly};
}

const TRENDS_GEO='AE';
function initNews(w){
  const body=$('[data-body]',w.el);$('[data-hx]',w.el).innerHTML=`<span id="nCd" style="font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:999px">59m 59s</span>${refreshBtn('nRef')}`;
  body.innerHTML=`<div class="tabs" id="nTabs"></div><input class="inp" id="nQ" placeholder="Search headlines…" style="margin:8px 0">
   <div class="list" id="nList"></div><div class="mut" id="nSrc" style="font-size:10.5px"></div>`;
  let cat='all',q='';
  const base=()=>[...LOCAL_NEWS,...TECH_FALL,...WORLD_FALL,...TREND_FALL];
  let items=LS.get('news2',null)||base();
  let last=LS.get('newsT2',0)||Date.now();
  const NAMES={local:'UAE & Gulf',tech:'Tech',world:'World',trend:'Trending'};
  const tabs=()=>{$('#nTabs').innerHTML=[['all','All'],['local','UAE & Gulf'],['tech','Tech'],['world','World'],['trend','🔥 Trending']].map(([k,l])=>`<button class="tab ${k===cat?'on':''}" data-k="${k}" style="--c:#f59e0b">${l}</button>`).join('')};
  const draw=()=>{
    const f=items.filter(x=>(cat==='all'?x.c!=='trend':x.c===cat)&&(!q||(x.t+' '+x.s).toLowerCase().includes(q)));
    $('#nList').innerHTML=f.map(x=>`<a class="it" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer"><div style="display:flex;gap:6px;align-items:center;margin-bottom:3px"><span class="chip" style="color:#fcd34d">${esc(x.s)}</span><span class="mut" style="font-size:10.5px">${NAMES[x.c]}${x.live?' · live':''}${x.n?' · '+esc(x.n):''}</span></div><div class="clamp2" style="font-weight:600;color:#fff">${x.rank?`<span style="color:#fbbf24">#${x.rank}</span> `:''}${esc(x.t)}</div></a>`).join('')||'<div class="mut">No headlines match your search.</div>';
  };
  async function trends(){
    const out=[];
    // 1) Google Trends daily RSS (UAE) via rss2json
    try{
      const j=await getJSON('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://trends.google.com/trending/rss?geo='+TRENDS_GEO));
      (j.items||[]).slice(0,10).forEach((s,i)=>out.push({t:s.title,u:'https://www.google.com/search?q='+encodeURIComponent(s.title),s:'Google Trends UAE',c:'trend',live:true,rank:i+1,n:s.description?'':''}));
    }catch(e){}
    // 2) Wikipedia most-read yesterday (keyless, CORS-enabled)
    try{
      const d=new Date(Date.now()-86400e3*1.5);const y=d.getUTCFullYear(),m=pad(d.getUTCMonth()+1),dd=pad(d.getUTCDate());
      const j=await getJSON(`https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/${y}/${m}/${dd}`);
      const skip=/^(Main_Page|Special:|Wikipedia:|Portal:|Help:|-$|Category:|File:)/;let r=0;
      j.items[0].articles.filter(a=>!skip.test(a.article)).slice(0,10).forEach(a=>out.push({t:a.article.replace(/_/g,' '),u:'https://en.wikipedia.org/wiki/'+encodeURIComponent(a.article),s:'Wikipedia',c:'trend',live:true,rank:++r,n:(a.views/1e3).toFixed(0)+'k reads'}));
    }catch(e){}
    return out;
  }
  async function refresh(){
    spinOn($('#nRef'),true);
    const out=[...LOCAL_NEWS];let live=0;
    try{
      const ids=await getJSON('https://hacker-news.firebaseio.com/v0/topstories.json');
      const top=await Promise.all(ids.slice(0,8).map(id=>getJSON(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)));
      top.filter(Boolean).forEach(s=>out.push({t:s.title,u:s.url||`https://news.ycombinator.com/item?id=${s.id}`,s:'Hacker News',c:'tech',live:true}));live++;
    }catch(e){}
    const feeds=await Promise.all(RSS.map(async ([u,s,c,n])=>{try{const j=await getJSON('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u),9000);return (j.items||[]).slice(0,n).map(i=>({t:i.title,u:i.link,s,c,live:true}))}catch(e){return []}}));
    feeds.forEach(f=>{if(f.length)live++;out.push(...f)});
    // curated hubs for sources with no live feed, so every tab always has breadth
    out.push(...TECH_FALL,...WORLD_FALL);
    const tr=await trends();out.push(...(tr.length?tr:[]),...TREND_FALL);
    if(tr.length)live++;
    items=out;LS.set('news2',items);last=Date.now();LS.set('newsT2',last);
    $('#nSrc').textContent=live?`Live feeds updated ${parts(TZ.uae).hour}:${parts(TZ.uae).minute} GST. Entries marked “live” are real headlines; the others open that outlet’s section.`:'Offline: showing curated source links. Reconnect and tap ⟳ for live headlines.';
    spinOn($('#nRef'),false);draw();
  }
  w.el.addEventListener('click',e=>{const t=e.target.closest('[data-k]');if(t){cat=t.dataset.k;tabs();draw()}});
  $('#nQ').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();draw()});
  $('#nRef').onclick=refresh;
  setInterval(()=>{const left=Math.max(0,3600-Math.floor((Date.now()-last)/1000));$('#nCd').textContent=`${Math.floor(left/60)}m ${pad(left%60)}s`;if(left===0)refresh()},1000);
  tabs();draw();if(Date.now()-last>3600e3||!LS.get('news2',null))refresh();else $('#nSrc').textContent='Cached headlines. Entries marked “live” are real headlines; the others open that outlet’s section.';
}

function initMovies(w){
  const body=$('[data-body]',w.el);$('[data-hx]',w.el).innerHTML=refreshBtn('mRef');
  body.innerHTML=`<div class="tabs" id="mTabs"></div><div class="list" id="mList" style="margin-top:8px"></div><div class="mut" id="mSrc" style="font-size:10.5px"></div>`;
  let f='all',live=LS.get('tvlive',[]);let seed=LS.get('mseed',{d:-1,s:1});
  if(seed.d!==dayNum()){seed={d:dayNum(),s:dayNum()};LS.set('mseed',seed)}
  const tabs=()=>{$('#mTabs').innerHTML=[['all','All'],['film','Films'],['tv','Series'],['cin','🎟 UAE Cinemas'],['nf','Netflix UAE'],['pv','Prime UAE']].map(([k,l])=>`<button class="tab ${f===k?'on':''}" data-m="${k}" style="--c:#fbbf24">${l}</button>`).join('')};
  const all=()=>shuffle([...CATALOG,...live],seed.s);
  const NOTE={cin:'Showing week of 22–25 Oct 2026. Full listings and showtimes: Vox · Reel · Novo.',nf:'Newest Netflix UAE additions, October 2026 (source: T-Break). Dates can change.',pv:'Newest Prime Video additions, October 2026. Regional UAE availability may differ.'};
  const draw=()=>{
    const grp={cin:CINEMA,nf:NETFLIX,pv:PRIME}[f];
    const v=grp?grp:all().filter(x=>f==='all'||x.k===f);
    const hub=f==='cin'?`<a class="it" href="https://uae.voxcinemas.com/movies/nowshowing" target="_blank" rel="noopener noreferrer" style="text-align:center;font-weight:700">🎟 Full now-showing list &amp; showtimes (Vox Cinemas) →</a>`:f==='nf'?`<a class="it" href="https://www.netflix.com/browse/new-releases" target="_blank" rel="noopener noreferrer" style="text-align:center;font-weight:700">Netflix top 10 &amp; new releases →</a>`:f==='pv'?`<a class="it" href="https://www.primevideo.com/" target="_blank" rel="noopener noreferrer" style="text-align:center;font-weight:700">Prime Video: browse new releases →</a>`:'';
    if(NOTE[f])$('#mSrc').textContent=NOTE[f];
    $('#mList').innerHTML=v.map(x=>`<a class="it" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-weight:700;color:#fff;flex:1">${esc(x.t)}</span>${x.r?`<span class="chip" style="color:#fde68a">⭐ ${x.r.toFixed?x.r.toFixed(1):x.r}</span>`:''}<span class="chip">${x.y}</span></div><div class="mut" style="font-size:11px">${(x.kind||x.k)==='film'?'🎞 Film':'📺 Series'} · ${esc(x.g)}${x.live?' · airing now':''}</div><div class="clamp2" style="font-size:12px;margin-top:3px;color:#cbd5e1">${esc(x.s)}</div></a>`).join('')||'<div class="mut">Nothing to show.</div>';
    $('#mList').innerHTML=hub+$('#mList').innerHTML;
  };
  async function load(){
    spinOn($('#mRef'),true);
    try{
      const j=await getJSON(`https://api.tvmaze.com/schedule?country=US&date=${todayUAE()}`);
      const seen=new Set(),out=[];
      j.filter(e=>e.show&&e.show.rating&&e.show.rating.average&&e.show.type==='Scripted').sort((a,b)=>b.show.rating.average-a.show.rating.average).forEach(e=>{if(seen.has(e.show.id)||out.length>=6)return;seen.add(e.show.id);
        const sm=(e.show.summary||'').replace(/<[^>]+>/g,'').trim();out.push({k:'tv',t:e.show.name,y:(e.show.premiered||'').slice(0,4)||'—',g:(e.show.genres||[]).slice(0,2).join(' · ')||'Series',r:e.show.rating.average,u:e.show.url,s:sm||'Currently airing.',live:true})});
      if(out.length){live=out;LS.set('tvlive',live);if(!NOTE[f])$('#mSrc').textContent='Live TVmaze schedule merged with the curated 2025–26 slate. Curated star ratings are approximate IMDb figures.'}
    }catch(e){if(!NOTE[f])$('#mSrc').textContent='Offline: showing the curated 2025–26 slate. Star ratings are approximate IMDb figures; blank means not yet rated.'}
    spinOn($('#mRef'),false);draw();
  }
  w.el.addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(t){f=t.dataset.m;tabs();draw()}});
  $('#mRef').onclick=()=>{seed={d:dayNum(),s:(Math.random()*1e9)|0};LS.set('mseed',seed);load()};
  tabs();draw();load();
}

function initPhoto(w){
  const body=$('[data-body]',w.el);body.style.padding='0';body.style.display='flex';body.style.flexDirection='column';
  $('[data-hx]',w.el).innerHTML=`<span id="pCd" style="font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25);padding:2px 8px;border-radius:999px">30m 00s</span>${refreshBtn('pRef')}`;
  body.innerHTML=`<div id="pBox" style="position:relative;flex:1;min-height:150px;background:#06121f;overflow:hidden">
    <img id="pImg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s">
    <svg id="pFb" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c4a6e"/><stop offset=".6" stop-color="#312e81"/><stop offset="1" stop-color="#831843"/></linearGradient></defs><rect width="400" height="240" fill="url(#pg)"/><circle cx="300" cy="70" r="34" fill="#fbbf24" opacity=".85"/><path d="M0 190 90 120 160 170 250 100 400 200V240H0Z" fill="#06121f" opacity=".8"/><path d="M0 215 120 165 230 205 320 160 400 210V240H0Z" fill="#020617" opacity=".9"/></svg>
    <div style="position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(2,6,23,.92))"><div id="pTit" style="font-weight:700;color:#fff"></div><div id="pCr" class="mut" style="font-size:11px"></div></div></div>`;
  let pool=[],cur=LS.get('photo',null),slotTs=LS.get('photoT',0);
  const show=p=>{
    if(!p)return;cur=p;const img=$('#pImg');img.style.opacity=0;
    img.onload=()=>{img.style.opacity=1;$('#pFb').style.opacity=0};
    img.onerror=()=>{img.style.opacity=0;$('#pFb').style.opacity=1};
    img.src=p.src;
    $('#pTit').innerHTML=p.page?`<a href="${esc(p.page)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:#fff">${esc(p.title)} ↗</a>`:esc(p.title);
    $('#pCr').textContent=p.credit||'';
  };
  const strip=h=>(h||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  async function fetchPool(){
    const y=2012+Math.floor(Math.random()*(new Date().getUTCFullYear()-2012)),mo=pad(1+Math.floor(Math.random()*12));
    const u=`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=categorymembers&gcmtitle=Category:Featured_pictures_on_Wikimedia_Commons&gcmtype=file&gcmlimit=40&gcmsort=timestamp&gcmdir=newer&gcmstart=${y}-${mo}-01T00:00:00Z&prop=imageinfo&iiprop=url&iiurlwidth=900&iiextmetadatafilter=ObjectName|Artist|ImageDescription|LicenseShortName&iiextmetadata=1`;
    const j=await getJSON(u,12000);
    return Object.values(j.query.pages).map(p=>{const ii=p.imageinfo&&p.imageinfo[0];if(!ii)return null;const m=ii.extmetadata||{};
      return {src:ii.thumburl||ii.url,title:strip(m.ObjectName&&m.ObjectName.value)||p.title.replace(/^File:|\.\w+$/g,''),credit:`Wikimedia Commons featured picture${m.Artist?' · '+strip(m.Artist.value).slice(0,60):''}${m.LicenseShortName?' · '+strip(m.LicenseShortName.value):''}`,page:ii.descriptionurl}}).filter(Boolean);
  }
  async function change(){
    spinOn($('#pRef'),true);
    try{
      if(pool.length<2)pool=await fetchPool();
      const p=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
      slotTs=Date.now();LS.set('photoT',slotTs);LS.set('photo',p);show(p);
    }catch(e){
      // second source: Picsum (random photographs, keyless)
      const id=Math.floor(Math.random()*900)+10;
      const p={src:`https://picsum.photos/id/${id}/900/600`,title:'Photograph from around the world',credit:'Picsum Photos · Unsplash photographers',page:`https://picsum.photos/id/${id}/info`};
      slotTs=Date.now();LS.set('photoT',slotTs);show(p);
      if(!cur)$('#pTit').textContent='Offline: reconnect and tap ⟳';
    }
    spinOn($('#pRef'),false);
  }
  $('#pRef').onclick=change;
  if(cur&&Date.now()-slotTs<1800e3)show(cur);else{$('#pTit').textContent='Loading today’s picture…';$('#pCr').textContent='Tap ⟳ if you are offline.';change()}
  setInterval(()=>{const left=Math.max(0,1800-Math.floor((Date.now()-slotTs)/1000));$('#pCd').textContent=`${Math.floor(left/60)}m ${pad(left%60)}s`;if(left===0)change()},1000);
}

function initHumor(w){
  const body=$('[data-body]',w.el);$('[data-hx]',w.el).innerHTML=refreshBtn('hRef');
  body.innerHTML=`<div class="tabs" id="hTabs"></div><div id="hBody" style="margin-top:8px"></div><div id="hSrc" class="mut" style="font-size:10.5px;margin-top:6px"></div>`;
  let tab='jokes',off=0;const seen=[];
  const tabs=()=>{$('#hTabs').innerHTML=[['jokes','😂 Jokes'],['art','📰 Articles']].map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-h="${k}" style="--c:#f472b6">${l}</button>`).join('')};
  const joke=(i)=>JOKES[((dayNum()*3+i)%JOKES.length+JOKES.length)%JOKES.length];
  seen.push({...(()=>{const j=joke(0);return {q:j[0],a:j[1]}})(),tag:'Joke of the day'});
  const draw=()=>{
    if(tab==='jokes'){
      $('#hBody').innerHTML=seen.slice(0,5).map((j,i)=>`<div class="card" style="margin-bottom:8px"><div class="mut" style="font-size:10.5px;margin-bottom:4px">${esc(j.tag)}</div><div style="font-weight:700;color:#fff">${esc(j.q)}</div><div class="rv" data-i="${i}" style="margin-top:6px;color:#fbcfe8;cursor:pointer;${i===0?'':'filter:blur(6px)'}" title="Click to reveal">${esc(j.a)}</div></div>`).join('');
    }else{
      const n=HUMOR_SITES.length;const base=(dayNum()*5+off*5)%n;
      $('#hBody').innerHTML='<div class="list">'+[0,1,2,3,4].map(i=>HUMOR_SITES[(base+i)%n]).map(a=>`<a class="it" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer"><div style="margin-bottom:3px"><span class="chip" style="color:#f9a8d4">${esc(a.src)}</span></div><div style="font-weight:700;color:#fff">${esc(a.t)}</div><div class="clamp2 mut" style="font-size:12px;margin-top:2px">${esc(a.sum)}</div></a>`).join('')+'</div>';
    }
    $('#hSrc').textContent=tab==='jokes'?'Click a blurred punchline to reveal it. New jokes come live from public joke APIs when online, otherwise from a built-in clean pool.':'Humor publications and comics. ⟳ shows the next five; the set rotates daily.';
  };
  async function more(){
    let j=null;
    try{const r=await getJSON('https://v2.jokeapi.dev/joke/Any?safe-mode&type=twopart',6000);if(r&&r.setup)j={q:r.setup,a:r.delivery,tag:'Live · JokeAPI'}}catch(e){}
    if(!j)try{const r=await getJSON('https://official-joke-api.appspot.com/random_joke',6000);if(r&&r.setup)j={q:r.setup,a:r.punchline,tag:'Live · Official Joke API'}}catch(e){}
    if(!j){off++;const p=joke(off*7+seen.length);j={q:p[0],a:p[1],tag:'From the built-in pool'}}
    seen.unshift(j);if(seen.length>8)seen.pop();
  }
  $('#hRef').onclick=async()=>{spinOn($('#hRef'),true);if(tab==='jokes')await more();else off++;spinOn($('#hRef'),false);draw()};
  w.el.addEventListener('click',e=>{const t=e.target.closest('[data-h]');if(t){tab=t.dataset.h;tabs();draw()}const r=e.target.closest('.rv');if(r)r.style.filter='none'});
  tabs();draw();
}
